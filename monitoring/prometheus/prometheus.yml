# =============================================================================
# Prometheus — Trancones Medellín
# Scrapea métricas de Spring Boot Actuator cada 15 segundos
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── Spring Boot Actuator (Micrometer Prometheus) ────────────────────────
  - job_name: "trancones-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          app: "trancones"
          environment: "production"

  # ── Prometheus self-monitoring ──────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── PostgreSQL (si se agrega postgres_exporter) ─────────────────────────
  # - job_name: "postgresql"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # ── Redis (si se agrega redis_exporter) ─────────────────────────────────
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
