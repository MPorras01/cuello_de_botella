name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend · Java 21 + Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y empaquetar
        working-directory: backend
        run: mvn -B package

      - name: Subir artefacto (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: trancones-backend.jar
          path: backend/target/trancones-*.jar
          retention-days: 7

  frontend:
    name: Frontend · Node + Vite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build de producción
        working-directory: frontend
        run: npm run build

      - name: Subir artefacto (dist)
        uses: actions/upload-artifact@v4
        with:
          name: trancones-frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagen backend
        run: docker build -t trancones-backend:ci backend/

      - name: Build imagen frontend
        run: docker build -t trancones-frontend:ci frontend/
